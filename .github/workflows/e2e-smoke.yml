# E2E smoke terhadap situs produksi (PB-08, 20 Oktober 2026).
#
# Berjalan setelah Vercel melaporkan deploy produksi berhasil
# (deployment_status), dan bisa dijalankan manual dari tab Actions. Hanya tes
# bertanda @smoke: jalur kritis publik, keamanan, dan halaman admin yang
# hanya MEMBACA data. Tidak ada tes yang menulis ke database, dan jalur
# formulir Tanya AI tidak memanggil OpenRouter, jadi tidak ada biaya AI.
#
# Secret: QA_ADMIN_EMAIL dan QA_ADMIN_PASSWORD (akun QA admin). Tanpa secret
# itu, proyek admin dilewati dan hanya tes publik yang jalan. Kunci InsForge
# sengaja tidak diberikan; tes yang membutuhkannya (TC-ROLE-01, TC-SEC-06)
# melewati dirinya sendiri.
name: E2E smoke produksi

on:
  deployment_status:
  workflow_dispatch:

concurrency:
  group: e2e-smoke
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL || 'https://cekharga-id.vercel.app' }}
      QA_ADMIN_EMAIL: ${{ secrets.QA_ADMIN_EMAIL }}
      QA_ADMIN_PASSWORD: ${{ secrets.QA_ADMIN_PASSWORD }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Ambil kode
        uses: actions/checkout@v6

      - name: Pasang pnpm (versi dari packageManager)
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Pasang Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Pasang dependensi
        run: pnpm install --frozen-lockfile

      # Runner ubuntu-latest sudah memuat Google Chrome (channel "chrome").
      - name: E2E smoke
        run: pnpm test:e2e:smoke --workers=2

      - name: Simpan laporan bila gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
